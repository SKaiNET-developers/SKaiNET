name: Feature Branch Libraries build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-job:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Print git commit variables
        run: |
          echo "TAG: $CURRENT_TAG"

      - name: Disk space (observability)
        run: df -h

      - name: Build and Test (PR)
        if: github.event_name == 'pull_request'
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          ./gradlew --no-daemon --stacktrace --info \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.configuration-cache=true \
            clean assemble allTests

      - name: Build and Test (push)
        if: github.event_name != 'pull_request'
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          ./gradlew --no-daemon --stacktrace --info \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.configuration-cache=true \
            assemble allTests

      - name: Memory info (on failure)
        if: failure()
        run: |
          free -h || true
          cat /proc/meminfo | head -n 50 || true

      - name: Upload all test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
