site:
  title: SKaiNET
  start_page: skainet::index.adoc

# Keep Antora's content cache inside the project tree so the
# container can be run as a non-root user (via `docker run --user
# $(id -u):$(id -g)`). Without this, Antora defaults to
# `$HOME/.cache/antora` which is unwritable when the container
# process has no matching passwd entry and $HOME falls back to `/`.
# The `.cache/` path is already gitignored via the pre-staged
# `## antora` section in the repo root .gitignore.
runtime:
  cache_dir: ./.cache/antora

content:
  sources:
    - url: /antora
      start_path: docs
      branches: HEAD

asciidoc:
  attributes:
    # LaTeX syntax for stem:[…] and [stem] blocks. Without this the
    # partials under partials/ops/**/*.adoc would be parsed as AsciiMath,
    # which doesn't understand `\in`, `\mathbb`, `\sum_{…}^{…}` etc. and
    # passes them through as literal text. MathJax is loaded by
    # supplemental-ui/partials/footer-scripts.hbs.
    stem: latexmath
  extensions:
    # Local mermaid block processor — renders every `[mermaid]` block
    # inline by invoking the @mermaid-js/mermaid-cli binary baked into
    # the Docker image at /opt/antora/node_modules/.bin/mmdc. Replaces
    # asciidoctor-kroki so builds don't depend on kroki.io at all,
    # which eliminates the GET-URL length limit (4 KB) that was
    # rejecting the large diagrams in hlo-getting-started.adoc.
    - /opt/antora/local-mermaid-extension.js

ui:
  bundle:
    # SKaiNET-branded UI bundle from the shared skainet-docs-ui repo:
    #   https://github.com/SKaiNET-developers/skainet-docs-ui
    # Pinned to a specific tag for reproducible builds. Bumping
    # this URL to a newer version is a one-line PR.
    url: https://github.com/SKaiNET-developers/skainet-docs-ui/releases/download/v1.1.1/ui-bundle.zip
    snapshot: true
  # Local overrides layered on top of the UI bundle. The footer-scripts
  # partial is replaced to inject MathJax so stem:[…] / [stem] blocks
  # render properly; upstream the change to skainet-docs-ui once the
  # math-in-ops-docs surface stabilises.
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site
